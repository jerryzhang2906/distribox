<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DistriBox — Distributed Virtual GPU</title>
<style>
  :root {
    --bg: #0A0E1A; --card: #141B2D; --input: #1C2541;
    --cyan: #00D4FF; --green: #00E676; --red: #FF3D60;
    --amber: #FFAB00; --purple: #7C4DFF;
    --text: #E8EAED; --gray: #8892B0; --muted: #495670;
    --divider: #1E2A45;
  }
  * { margin:0; padding:0; box-sizing:border-box }
  body { font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); padding:28px 32px; min-height:100vh }
  .header { text-align:center; margin-bottom:24px }
  .header .logo { font-size:40px; margin-bottom:4px }
  .header h1 { font-size:26px; color:var(--cyan); font-weight:700; letter-spacing:-0.5px }
  .header .sub { font-size:13px; color:var(--muted); letter-spacing:1px; text-transform:uppercase; margin-top:2px }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; max-width:1000px; margin:0 auto }
  .card { background:var(--card); border:1px solid var(--divider); border-radius:12px; padding:18px 20px }
  .card.full { grid-column:1/-1 }
  .card h3 { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1.5px; margin-bottom:14px; font-weight:600 }
  .vspec { display:grid; grid-template-columns:1fr 1fr; gap:10px }
  .vspec .item label { font-size:11px; color:var(--muted); display:block; margin-bottom:3px }
  .vspec .item .val { font-size:17px; font-weight:600; color:var(--cyan) }
  .worker { display:flex; align-items:center; padding:9px 0; border-bottom:1px solid var(--divider); gap:10px }
  .worker:last-child { border-bottom:none }
  .worker .dot { width:10px; height:10px; border-radius:50%; flex-shrink:0 }
  .worker .dot.online { background:var(--green); box-shadow:0 0 8px var(--green) }
  .worker .dot.offline { background:var(--red) }
  .worker .dot.busy { background:var(--amber); box-shadow:0 0 6px var(--amber) }
  .worker .info { flex:1; min-width:0 }
  .worker .name { font-weight:600; font-size:13px }
  .worker .detail { font-size:11px; color:var(--gray); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .worker .usage { display:flex; gap:10px; font-size:11px; color:var(--gray); flex-shrink:0 }
  .worker .bar { height:4px; border-radius:2px; background:var(--divider); margin-top:3px; overflow:hidden }
  .bar .fill { height:100%; border-radius:2px; transition:width .5s }
  .fill.cpu { background:var(--cyan) }
  .fill.gpu { background:var(--purple) }
  .fill.ram { background:var(--amber) }
  .log { font-family:'Cascadia Code','Consolas',monospace; font-size:11px; color:var(--gray); max-height:150px; overflow-y:auto; white-space:pre-wrap; line-height:1.6 }
  .empty { text-align:center; padding:20px; color:var(--muted); font-size:13px }
  .actions { display:flex; gap:8px; flex-wrap:wrap }
  .actions button { padding:9px 16px; border:none; border-radius:8px; font-weight:600; cursor:pointer; font-size:12px; font-family:inherit; transition:opacity .15s }
  .actions button:hover { opacity:.85 }
  .btn-cyan { background:var(--cyan); color:#0A0E1A }
  .btn-outline { background:transparent; color:var(--text); border:1px solid var(--muted) }
  #action-result { margin-top:10px; font-size:11px; color:var(--gray); min-height:18px }
  .status-bar { text-align:center; margin-top:18px; font-size:11px; color:var(--muted) }
  .status-bar .live { color:var(--green); animation:pulse 2s infinite }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  @media(max-width:720px) { .grid{grid-template-columns:1fr} body{padding:14px} }
</style>
</head>
<body>
<div class="header">
  <div class="logo">⚡</div>
  <h1>DistriBox</h1>
  <div class="sub">Distributed Virtual GPU · v0.3.1</div>
</div>

<div class="grid">
  <div class="card">
    <h3>Virtual GPU</h3>
    <div class="vspec">
      <div class="item"><label>Model</label><div class="val" id="vgpu-name">—</div></div>
      <div class="item"><label>VRAM</label><div class="val" id="vgpu-vram">—</div></div>
      <div class="item"><label>Compute Units</label><div class="val" id="vgpu-cu">—</div></div>
      <div class="item"><label>Workers Online</label><div class="val" id="vgpu-workers">0</div></div>
    </div>
  </div>

  <div class="card">
    <h3>Actions</h3>
    <div class="actions">
      <button class="btn-cyan" onclick="action('install')">Install ICD</button>
      <button class="btn-outline" onclick="action('uninstall')">Uninstall</button>
      <button class="btn-outline" onclick="action('status')">Check Status</button>
    </div>
    <div id="action-result"></div>
  </div>

  <div class="card full">
    <h3>Workers</h3>
    <div id="worker-list"><div class="empty">Waiting for workers to connect...</div></div>
  </div>

  <div class="card full">
    <h3>Event Log</h3>
    <div class="log" id="log">DistriBox v0.3.1 starting...<br></div>
  </div>
</div>

<div class="status-bar">
  <span class="live">●</span> Live · Auto-refresh 2s · API: localhost:13801
</div>

<script>
const API = 'http://localhost:13801';

function log(msg) {
  const el = document.getElementById('log');
  el.textContent += new Date().toLocaleTimeString() + '  ' + msg + '\n';
  el.scrollTop = el.scrollHeight;
}

async function refresh() {
  try {
    const r = await fetch(API + '/api/v1/status');
    const d = await r.json();
    const dev = d.device || {};
    document.getElementById('vgpu-name').textContent = dev.name || 'Unknown';
    document.getElementById('vgpu-vram').textContent = ((dev.vram_total_mb || 0) / 1024).toFixed(1) + ' GB';
    document.getElementById('vgpu-cu').textContent = dev.compute_units || 0;
    document.getElementById('vgpu-workers').textContent = d.worker_count || 0;
  } catch(e) { /* server starting */ }

  try {
    const wr = await fetch(API + '/api/v1/workers');
    const wd = await wr.json();
    const workers = wd.workers || [];
    const list = document.getElementById('worker-list');
    if (!workers.length) {
      list.innerHTML = '<div class="empty">Waiting for workers to connect...</div>';
      return;
    }
    list.innerHTML = workers.map(w => `
      <div class="worker">
        <div class="dot ${w.status === 'idle' ? 'online' : w.status === 'busy' ? 'busy' : 'offline'}"></div>
        <div class="info">
          <div class="name">${w.name || w.id}</div>
          <div class="detail">${w.has_gpu ? 'GPU' : 'CPU'} · Score ${(w.capability_score || 0).toFixed(1)} · RAM ${(w.available_ram_mb || 0)} MB</div>
          <div class="bar"><div class="fill cpu" style="width:${w.cpu_pct || 0}%"></div></div>
        </div>
        <div class="usage">
          <span>CPU ${Math.round(w.cpu_pct || 0)}%</span>
          <span>RAM ${Math.round(w.ram_pct || 0)}%</span>
        </div>
      </div>
    `).join('');
  } catch(e) { /* no workers yet */ }
}

async function action(cmd) {
  const el = document.getElementById('action-result');
  try {
    const r = await fetch(API + '/api/v1/icd/' + cmd, { method: 'POST' });
    const d = await r.json();
    el.textContent = d.status + ': ' + (d.message || d.output || '');
    el.style.color = d.status === 'ok' ? 'var(--green)' : 'var(--red)';
    log('ICD ' + cmd + ': ' + d.status);
  } catch(e) {
    el.textContent = 'Error: ' + e.message;
    el.style.color = 'var(--red)';
  }
}

refresh();
setInterval(refresh, 2000);
log('Dashboard ready');
</script>
</body>
</html>
