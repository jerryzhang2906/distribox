syntax = "proto3";

package distri.v1;
option go_package = "github.com/distribox/pkg/protocol/distri/v1;distriv1";

// ─────────────────────────────────────────────────────────
// Compute task representation
// These are the internal representations used by VGPU Core
// to describe OpenCL compute operations to Workers.
// ─────────────────────────────────────────────────────────

// A compute task representing an NDRange kernel execution
message ComputeTask {
  string kernel_id = 1;
  string kernel_name = 2;
  string program_id = 3;

  // NDRange specification for this sub-task
  uint32 work_dim = 4;
  repeated uint64 global_work_size = 5;    // This worker's portion
  repeated uint64 global_work_offset = 6;  // Offset in the global space
  repeated uint64 local_work_size = 7;

  // Kernel arguments
  repeated KernelArg args = 8;
}

// A kernel argument (maps to clSetKernelArg)
message KernelArg {
  uint32 index = 1;
  oneof value {
    BufferArg buffer = 2;
    ScalarArg scalar = 3;
  }
}

message BufferArg {
  string buffer_id = 1;
  uint64 offset = 2;
  uint64 size_bytes = 3;
  uint32 flags = 4;               // cl_mem_flags
}

message ScalarArg {
  bytes data = 1;                 // Raw bytes of the scalar value
  uint32 size_bytes = 2;          // sizeof(arg)
}

// ── Buffer management ──────────────────────────────────

// Describe a region within a buffer (for partial results)
message BufferRegion {
  string buffer_id = 1;
  uint64 offset_bytes = 2;
  uint64 size_bytes = 3;
  bytes data = 4;  // Inline data for returning output buffers
}

// Create/register a buffer on a worker
message BufferCreateRequest {
  string buffer_id = 1;
  uint64 size_bytes = 2;
  uint32 flags = 3;               // cl_mem_flags: READ_ONLY, WRITE_ONLY, READ_WRITE
  BufferType buffer_type = 4;
}

enum BufferType {
  BUFFER_TYPE_UNSPECIFIED = 0;
  BUFFER_TYPE_READ_ONLY = 1;      // Model weights — replicated to all workers
  BUFFER_TYPE_READ_WRITE = 2;     // Activations — partitioned across workers
  BUFFER_TYPE_TEMPORARY = 3;      // Small, frequent changes — sent inline
}

// ── Read/Write/Copy commands ───────────────────────────

message ReadBufferRequest {
  string buffer_id = 1;
  uint64 offset_bytes = 2;
  uint64 size_bytes = 3;
}

message ReadBufferResponse {
  bytes data = 1;
  uint64 bytes_read = 2;
}

message WriteBufferRequest {
  string buffer_id = 1;
  uint64 offset_bytes = 2;
  bytes data = 3;
}

message CopyBufferRequest {
  string src_buffer_id = 1;
  string dst_buffer_id = 2;
  uint64 src_offset = 3;
  uint64 dst_offset = 4;
  uint64 size_bytes = 5;
}

message FillBufferRequest {
  string buffer_id = 1;
  bytes pattern = 2;
  uint64 offset_bytes = 3;
  uint64 size_bytes = 4;
}

// ── Program/Kernel management ──────────────────────────

message CreateProgramRequest {
  string program_id = 1;
  bytes source = 2;               // OpenCL C source code
  string options = 3;             // Compile options
}

message BuildProgramRequest {
  string program_id = 1;
  string options = 2;
}

message BuildProgramResponse {
  bool success = 1;
  string build_log = 2;
  repeated KernelBinary binaries = 3;
}

message KernelBinary {
  string kernel_name = 1;
  bytes binary = 2;               // Platform-specific compiled binary
}

message CreateKernelRequest {
  string kernel_id = 1;
  string kernel_name = 2;
  string program_id = 3;
}
